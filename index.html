<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Investor Olympics: a classroom investment game for Class 3 of the design-driven entrepreneurship course.">
<script src="config.js"></script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/3.10.1/cloudbase.full.js"></script>
<title>Investor Olympics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Noto+Sans+SC:wght@400;600&amp;display=swap">
<style>
/* Layout: one dark trading-floor screen; a left scoreboard rail, a central card table, a bottom action bar. Single dark theme by choice: the course deck is dark. */
:root{
  --bg:#0e0e12; --panel:#17171d; --panel2:#1f1f27; --line:#2b2b35; --fg:#f4f2ee; --muted:#b3b0aa;
  --mission:#4a63d8; --method:#e0288a; --multi:#8dc63f; --mind:#f28a1c; --gold:#f2c318;
  --good:#8dc63f; --warn:#f2c318; --bad:#ff5a5f;
  --display:'Outfit','Noto Sans SC',system-ui,sans-serif; --body:'Outfit','Noto Sans SC',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px;padding-inline:16px;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
h1{font-size:clamp(26px,4vw,40px);font-weight:700;line-height:1.05}
h2{font-size:20px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .zh{color:var(--muted);font-size:.92em}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--multi);font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--fg);border-color:var(--multi)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border-radius:14px;padding:14px;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-family:var(--display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted)}
.pill.good{color:var(--good)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid transparent}
.card.sel{border-color:var(--multi)}
.card h3{font-size:17px}
.tag{font-size:12px;color:var(--muted)}
.sbc{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.sbc span{color:var(--muted)} .sbc b{font-weight:600;font-variant-numeric:tabular-nums}
.signals{font-size:13px;display:flex;flex-direction:column;gap:3px;padding-left:16px;margin:0}
.alloc{display:flex;align-items:center;gap:8px;margin-top:auto}
.alloc input[type=range]{flex:1;accent-color:var(--multi)}
.alloc output{min-width:64px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel2);border-radius:14px;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
button.primary{background:var(--multi);color:#0e0e12;border:0;padding:11px 18px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:10px;font:inherit;min-width:0}
.meter{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--multi);width:0}
.event{border-left:4px solid var(--gold);padding-left:12px}
.result{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;font-size:14px}
.result b{font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.pts{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pts div{display:flex;justify-content:space-between;gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.medal{font-weight:700}
.timer{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;font-weight:700}
.big{font-family:var(--display);font-size:clamp(34px,6vw,64px);font-weight:700;line-height:1;color:var(--gold)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel2);padding:4px 8px;border-radius:8px;letter-spacing:.08em}
details summary{cursor:pointer;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.meter i{transition:width .4s ease}}
</style>
</head>
<body>
<style>
[hidden]{display:none!important}
.refl{display:flex;flex-direction:column;gap:10px}.refl label{display:flex;flex-direction:column;gap:4px;font-size:14px}.refl span{color:var(--muted)}
textarea{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:10px;font:inherit;resize:vertical}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}.bars .b{display:grid;grid-template-columns:minmax(120px,1fr) 3fr auto;gap:10px;align-items:center;font-size:13px}
.bars .track{height:14px;background:var(--panel2);border-radius:99px;overflow:hidden}.bars .fill{height:100%;background:var(--multi)}.bars .fill.bad{background:var(--bad)}.bars .fill.gold{background:var(--gold)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}.kv div{background:var(--panel2);border-radius:10px;padding:10px}.kv b{display:block;font-size:22px;font-family:var(--display)}.kv small{color:var(--muted)}
.prompts{margin-top:10px;border-left:4px solid var(--gold);padding-left:12px}.prompts li{margin-bottom:4px}
.rtab{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:999px;font:inherit;cursor:pointer}.rtab[aria-pressed="true"]{background:var(--panel2);color:var(--fg);border-color:var(--gold)}
.tcard{background:var(--panel2);border-radius:10px;padding:10px;font-size:14px}.tcard b{display:block;margin-bottom:4px}.tcard p{color:var(--muted);margin-bottom:4px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:6px 12px;font:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);font-weight:600}
</style>
<div class="wrap">
  <header>
    <div>
      <div class="row"><span class="dots"><i style="background:var(--mission)"></i><i style="background:var(--method)"></i><i style="background:var(--multi)"></i><i style="background:var(--mind)"></i></span><span class="eyebrow" data-en="Class 3 · Multiplicity" data-zh="第三课 · 多元性"></span></div>
      <h1 data-en="Investor Olympics" data-zh="投资奥运会"></h1>
      <p class="muted" data-en="Five rounds, ¥10 million, twenty ventures. Read the signals, read the canvas, place your bets." data-zh="五轮、一千万、二十家企业。读信号，读画布，下注。"></p>
    </div>
    <div class="row">
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh" aria-pressed="false">中文</button></div>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="play" id="tab-play" data-en="Play" data-zh="比赛"></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="rules" id="tab-rules" data-en="Rules" data-zh="规则"></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="board" id="tab-board" data-en="Leaderboard" data-zh="排行榜"></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="debrief" id="tab-debrief" data-en="Debrief" data-zh="复盘"></button>
      </nav>
    </div>
  </header>

  <!-- PLAY -->
  <section id="view-play" class="grid">
    <aside class="rail">
      <div class="panel stat"><small data-en="Fund" data-zh="基金"></small><b id="teamName"></b><small id="teamMeta" class="muted"></small></div>
      <div class="panel stat"><small data-en="Portfolio value" data-zh="组合价值"></small><b id="value">¥10.0M</b><small id="valueDelta" class="muted"></small></div>
      <div class="panel stat"><small data-en="Strategy points" data-zh="策略分"></small><b id="points">0</b><small class="muted" data-en="max 11 per round" data-zh="每回合最多 11 分"></small></div>
      <div class="panel stat"><small data-en="Round" data-zh="回合"></small><b id="roundNo">0 / 5</b><div class="meter" aria-hidden="true"><i id="roundBar"></i></div></div>
      <div class="panel stat"><small data-en="Clock" data-zh="计时"></small><b class="timer" id="clock">4:00</b><div class="row"><button class="ghost" id="startClock" data-en="Start 4 min" data-zh="开始 4 分钟"></button><button class="ghost" id="resetClock" data-en="Reset" data-zh="重置"></button></div></div>
    </aside>

    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <div class="panel" id="setup">
        <h2 data-en="Register your fund" data-zh="注册你的基金"></h2>
        <p class="muted" style="margin-top:4px" data-en="One device per team. Three to five investors. You start with ¥10,000,000 and five years." data-zh="每队一台设备，三到五位投资人。起始资金一千万元，时限五年。"></p>
        <form id="setupForm" class="row" style="margin-top:12px">
          <label for="teamInput" class="muted" data-en="Team name" data-zh="队名"></label>
          <input type="text" id="teamInput" maxlength="28" required data-ph-en="e.g. Lujiazui Capital" data-ph-zh="例如：陆家嘴资本">
          <label for="sessionInput" class="muted" data-en="Class code" data-zh="课堂码"></label>
          <input type="text" id="sessionInput" maxlength="16" style="width:140px" data-ph-en="from the facilitator" data-ph-zh="主持人提供">
          <button class="primary" type="submit" data-en="Open the floor" data-zh="开始"></button>
        </form>
        <p class="hint" id="syncHint" style="margin-top:8px"></p>
      </div>

      <div id="round" hidden style="display:flex;flex-direction:column;gap:12px">
        <div class="panel">
          <div class="row" style="justify-content:space-between">
            <div><span class="eyebrow" id="rTheme"></span><h2 id="rTitle"></h2></div>
            <span class="pill" id="rYear"></span>
          </div>
          <p class="muted" style="margin-top:6px" id="rBrief"></p>
          <div style="margin-top:10px"><h3 data-en="Signals this year (STEEP)" data-zh="今年的信号（STEEP）"></h3><ul class="signals" id="rSignals"></ul></div>
        </div>
        <div class="cards" id="cards"></div>
        <div class="bar">
          <div><b id="allocTotal">¥0.0M</b> <span class="muted" data-en="allocated of" data-zh="已分配，共"></span> <b id="allocAvail">¥10.0M</b> <span class="muted" data-en=" · cash stays in the bank at 0%" data-zh=" · 未投现金保本，收益 0%"></span></div>
          <button class="primary" id="commit" data-en="Commit allocation" data-zh="确认投资"></button>
        </div>
      </div>

      <div id="result" hidden style="display:flex;flex-direction:column;gap:12px">
        <div class="panel event">
          <span class="eyebrow" style="color:var(--gold)" data-en="The year unfolds" data-zh="这一年发生了什么"></span>
          <h2 id="evTitle"></h2>
          <p class="muted" style="margin-top:6px" id="evText"></p>
        </div>
        <div class="panel">
          <h3 data-en="Your ventures" data-zh="你的投资"></h3>
          <div class="result" id="evResults" style="margin-top:8px"></div>
          <p style="margin-top:10px"><b data-en="Portfolio:" data-zh="组合："></b> <span id="evPortfolio"></span></p>
        </div>
        <div class="panel">
          <h3 data-en="Strategy points this round" data-zh="本回合策略分"></h3>
          <div class="pts" id="evPoints" style="margin-top:8px"></div>
        </div>
        <div class="panel">
          <h3 data-en="What a strategic investor saw" data-zh="策略投资者看到了什么"></h3>
          <p class="muted" style="margin-top:6px" id="evLesson"></p>
        </div>
        <div class="bar"><span class="muted" id="nextNote"></span><button class="primary" id="next"></button></div>
      </div>

      <div id="final" hidden style="display:flex;flex-direction:column;gap:12px">
        <div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center">
          <span class="eyebrow" style="color:var(--gold)" data-en="Final result" data-zh="最终成绩"></span>
          <div class="big" id="finalScore">0</div>
          <p><b id="finalTeam"></b> · <span data-en="Olympic score = portfolio index + strategy points" data-zh="奥运分 = 组合指数 + 策略分"></span></p>
          <p class="muted" id="finalBreak"></p>
          <p><span data-en="Report this code to the facilitator:" data-zh="向主持人报告此代码："></span> <span class="code" id="finalCode"></span></p>
          <div class="row" style="justify-content:center"><button class="ghost" id="copyCode" data-en="Copy result" data-zh="复制成绩"></button><button class="ghost" id="copyFull" data-en="Copy full record for the debrief" data-zh="复制完整记录（供复盘）"></button><button class="ghost" id="replay" data-en="Play again" data-zh="再玩一次"></button></div>
          <p class="hint" id="syncState"></p>
        </div>
        <div class="panel">
          <h3 data-en="Your five years" data-zh="你的五年"></h3>
          <div style="overflow-x:auto;margin-top:8px"><table id="history"><thead><tr><th data-en="Round" data-zh="回合"></th><th data-en="Event" data-zh="事件"></th><th class="num" data-en="Return" data-zh="回报"></th><th class="num" data-en="Points" data-zh="策略分"></th><th class="num" data-en="Value after" data-zh="期末价值"></th></tr></thead><tbody></tbody></table></div>
        </div>
        <div class="panel">
          <h3 data-en="Team reflection: answer before the class debrief" data-zh="团队反思：课堂复盘前先回答"></h3>
          <p class="hint" style="margin-top:4px" data-en="Two or three sentences each. Your answers appear on the facilitator’s debrief screen next to your results." data-zh="每题两三句。答案会和你们的成绩一起显示在主持人的复盘屏幕上。"></p>
          <div class="refl" style="margin-top:8px">
            <label><span data-en="1 · Which signal did you read correctly, and which did you ignore?" data-zh="1 · 哪条信号你们读对了，哪条被忽略了？"></span><textarea id="q1" rows="2" maxlength="400"></textarea></label>
            <label><span data-en="2 · In the venture that paid best, where did the money actually come from? (SBC box 10, who pays)" data-zh="2 · 回报最好的那家企业，钱究竟从哪里来？（画布第 10 格，谁付费）"></span><textarea id="q2" rows="2" maxlength="400"></textarea></label>
            <label><span data-en="3 · Which red flag did you fund anyway, and why did it look attractive?" data-zh="3 · 哪个明显的风险你们还是投了？它为什么看起来有吸引力？"></span><textarea id="q3" rows="2" maxlength="400"></textarea></label>
            <label><span data-en="4 · One change this makes to your Thing’s business model for Assignment 3 (name the SBC box or template)" data-zh="4 · 这会让你们在作业三中改变未来物品商业模式的哪一点（写出画布格或模板名）"></span><textarea id="q4" rows="2" maxlength="400"></textarea></label>
          </div>
          <div class="row" style="margin-top:10px"><button class="primary" id="saveRefl" data-en="Save reflection" data-zh="保存反思"></button><span class="hint" id="reflMsg"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- RULES -->
  <section id="view-rules" hidden class="panel" style="display:flex;flex-direction:column;gap:12px">
    <h2 data-en="How to play" data-zh="玩法"></h2>
    <ol class="signals" style="font-size:15px">
      <li data-en="Each team is an investment fund with ¥10,000,000. The game lasts five rounds, one year each." data-zh="每队是一支拥有一千万元的投资基金。比赛共五轮，每轮代表一年。"></li>
      <li data-en="Every round shows four ventures with a mini Sustainable Business Canvas: who pays, price, contribution margin, fixed cost, break-even against current sales, planet and people impact, organizational model, AI exposure, and three signals." data-zh="每轮展示四家企业，各附一张迷你可持续商业画布：谁付费、单价、单位贡献、固定成本、盈亏平衡与当前销量对比、对地球与社会的影响、组织模式、AI 暴露度，以及三条信号。"></li>
      <li data-en="Before you allocate, read the year’s STEEP signals. They hint at the event that will hit after you commit." data-zh="分配资金前，先读当年的 STEEP 信号。它们预示着确认之后会发生的事件。"></li>
      <li data-en="Allocate any amount across the four ventures with the sliders. Unallocated cash stays safe at 0%." data-zh="用滑块在四家企业之间任意分配。未分配的现金保本，收益为 0%。"></li>
      <li data-en="Commit. The year’s event unfolds and each venture returns a multiple of what you put in." data-zh="确认后，当年事件揭晓，每家企业按倍数返还你的投入。"></li>
      <li data-en="Strategy points reward how you chose, not only what you earned." data-zh="策略分奖励的是选择的质量，不只是赚了多少。"></li>
      <li data-en="After round five, the Olympic score is your portfolio index (final value as a percentage of ¥10M) plus all strategy points. Report the score and code to the facilitator." data-zh="五轮结束后，奥运分 = 组合指数（期末价值占一千万的百分比）+ 全部策略分。把分数和代码报给主持人。"></li>
    </ol>
    <h2 data-en="Strategy points, each round" data-zh="每回合的策略分"></h2>
    <div class="pts">
      <div><span data-en="Diversified: at least three ventures with 15% or more each" data-zh="分散：至少三家企业各占 15% 以上"></span><b>+2</b></div>
      <div><span data-en="Impact: 40% or more in ventures with a positive planet score" data-zh="影响：40% 以上投入对地球正面的企业"></span><b>+3</b></div>
      <div><span data-en="Unit economics: 50% or more in ventures with a positive margin and break-even within twice current sales" data-zh="单位经济：50% 以上投入单位贡献为正、且盈亏平衡点不超过当前销量两倍的企业"></span><b>+3</b></div>
      <div><span data-en="Resilience: portfolio did not lose value after the event" data-zh="韧性：事件之后组合未缩水"></span><b>+2</b></div>
      <div><span data-en="Reserve: kept 10% to 30% in cash" data-zh="储备：保留 10% 至 30% 现金"></span><b>+1</b></div>
      <div><span data-en="Trap: 25% or more in a venture with a hidden red flag" data-zh="踩雷：25% 以上投入有隐藏风险的企业"></span><b class="down">−3</b></div>
    </div>
    <p class="hint" data-en="Everything here is fictional and built from patterns in the lecture: franchise supply chains, app-first retail, product-as-a-service, circular products, outcome pricing, cooperatives and purpose trusts. Numbers are illustrative." data-zh="所有企业均为虚构，取材于本课讲到的模式：加盟供应链、应用优先零售、产品即服务、循环产品、按结果定价、合作社与使命信托。数字仅为示例。"></p>
  </section>

  <!-- LEADERBOARD -->
  <section id="view-board" hidden class="panel" style="display:flex;flex-direction:column;gap:12px">
    <h2 data-en="Leaderboard" data-zh="排行榜"></h2>
    <p class="muted" data-en="Facilitator’s device. Enter each team’s reported score and code; the code must match the score. Stored only in this browser." data-zh="主持人设备。录入各队报告的分数与代码，代码必须与分数匹配。数据只保存在此浏览器。"></p>
    <form id="boardForm" class="row">
      <input type="text" id="bTeam" maxlength="28" required data-ph-en="Team" data-ph-zh="队名">
      <input type="number" id="bScore" min="0" max="999" required style="width:110px" data-ph-en="Score" data-ph-zh="分数">

     '<div><div class="tag">'+t('signals')+'</div><ul class="signals">'+g('signals').map(s=>'<li>'+s+'</li>').join('')+'</ul></div>'+
     '<div class="alloc"><label for="r'+i+'" class="tag">'+t('invest')+'</label><input type="range" id="r'+i+'" min="0" max="'+(S.value/M).toFixed(1)+'" step="0.1" value="'+(S.alloc[i]/M).toFixed(1)+'"><output id="o'+i+'">'+fmt(S.alloc[i])+'</output></div>';
    cards.appendChild(c);
    c.querySelector('input').addEventListener('input',e=>{ S.alloc[i]=parseFloat(e.target.value)*M; clamp(i); refreshAlloc(); }); });
  $('allocAvail').textContent=fmt(S.value); refreshAlloc(); if(!keepAlloc) window.scrollTo({top:0}); }
function clamp(i){ const total=S.alloc.reduce((a,b)=>a+b,0); if(total>S.value+1){ S.alloc[i]-= (total-S.value); if(S.alloc[i]<0)S.alloc[i]=0; $('r'+i).value=(S.alloc[i]/M).toFixed(1);} }
function refreshAlloc(){ const total=S.alloc.reduce((a,b)=>a+b,0); S.alloc.forEach((a,i)=>{ $('o'+i).textContent=fmt(a); $('card'+i).classList.toggle('sel',a>0); }); $('allocTotal').textContent=fmt(total); $('commit').disabled=total<=0; }

// ---------- scoring (always on EN fields) ----------
function score(R,alloc,value){ const ev=R.event.id; const total=alloc.reduce((a,b)=>a+b,0); const cash=value-total; let out=0; const lines=[];
  R.ventures.forEach((v,i)=>{ const m=v.mult[ev]!==undefined?v.mult[ev]:v.mult.base; const after=alloc[i]*m; out+=after; lines.push({i,put:alloc[i],m,after}); });
  const newValue=out+cash; const pts=[]; let p=0;
  const n=alloc.filter(a=>a>=0.15*value).length; if(n>=3){p+=2;pts.push(['div',[n],2]);} else pts.push(['divNo',[],0]);
  const impact=alloc.reduce((s,a,i)=>s+(R.ventures[i].planet>0?a:0),0); const ip=Math.round(impact/value*100); if(impact>=0.4*value){p+=3;pts.push(['imp',[ip],3]);} else pts.push(['impNo',[ip],0]);
  const unit=alloc.reduce((s,a,i)=>{ const v=R.ventures[i]; const ok=v.margin.trim().startsWith('+')&&!/never/.test(v.be)&&beRatio(v.be)<=2; return s+(ok?a:0); },0); const up=Math.round(unit/value*100); if(unit>=0.5*value){p+=3;pts.push(['unit',[up],3]);} else pts.push(['unitNo',[up],0]);
  if(newValue>=value){p+=2;pts.push(['res',[],2]);} else pts.push(['resNo',[],0]);
  const cp=Math.round(cash/value*100); if(cash>=0.1*value&&cash<=0.3*value){p+=1;pts.push(['resv',[cp],1]);} else pts.push(['resvNo',[cp],0]);
  R.ventures.forEach((v,i)=>{ if(v.flag&&alloc[i]>=0.25*value){p-=3;pts.push(['trap',[Math.round(alloc[i]/value*100),i],-3]);} });
  return {lines,newValue,cash,pts,p}; }
function beRatio(be){ const m=be.match(/([\d.,]+)([kM]?)\s.*?vs\s([\d.,]+)([kM]?)/); if(!m)return 99; const f=(n,u)=>parseFloat(n.replace(/,/g,''))*(u==='M'?1e6:u==='k'?1e3:1); return f(m[1],m[2])/f(m[3],m[4]); }
function ptLabel(ri,x){ const k=x[0], a=x[1]; const P=t('pts'); if(k==='trap'){ const v=ROUNDS[ri].ventures[a[1]]; return P.trap(a[0],v.name,tx(v,vz(ri,a[1]),'flag')); } const f=P[k]; return typeof f==='function'?f.apply(null,a):f; }

function showResult(){ const r=S.last; if(!r) return; const ri=r.ri; const R=ROUNDS[ri]; const Z=rz(ri); show('result');
  $('evTitle').textContent=tx(R.event,Z.event,'title'); $('evText').textContent=tx(R.event,Z.event,'text');
  $('evResults').innerHTML=r.lines.map(l=>'<div>'+R.ventures[l.i].name+' <span class="tag">× '+l.m.toFixed(2)+'</span></div><b class="'+(l.after>=l.put?'up':'down')+'">'+fmt(l.put)+' → '+fmt(l.after)+'</b>').join('')+'<div>'+t('cash')+'</div><b>'+fmt(r.cash)+'</b>';
  const ret=r.newValue/r.before-1; $('evPortfolio').innerHTML=fmt(r.before)+' → <b class="'+(ret>=0?'up':'down')+'">'+fmt(r.newValue)+' ('+(ret>=0?'+':'')+(ret*100).toFixed(1)+'%)</b>';
  $('evPoints').innerHTML=r.pts.map(x=>'<div><span>'+ptLabel(ri,x)+'</span><b class="'+(x[2]>0?'up':x[2]<0?'down':'muted')+'">'+(x[2]>0?'+':'')+x[2]+'</b></div>').join('')+'<div><span><b>'+t('roundTotal')+'</b></span><b>'+(r.p>=0?'+':'')+r.p+'</b></div>';
  $('evLesson').textContent=tx(R.event,Z.event,'lesson'); $('nextNote').textContent=S.round<5?t('roundOf')(S.round+1)+fmt(S.value)+t('toInvest'):t('fiveDone'); $('next').textContent=S.round<5?t('nextRound'):t('finalResult'); }

$('commit').addEventListener('click',()=>{ const ri=S.round; const R=ROUNDS[ri]; const before=S.value; const r=score(R,S.alloc,before); r.ri=ri; r.before=before;

function paintRound(teams,ri){ const R=ROUNDS[ri]; const Z=rz(ri); const rows=teams.map(r=>(r.rounds||[]).find(x=>x.ri===ri)).filter(Boolean); const el=$('dbRound');
  if(!rows.length){ el.innerHTML='<p class="hint">'+tx(R,Z,'theme')+' · '+tx(R.event,Z.event,'title')+'</p><ol class="signals prompts">'+t('prompts')[ri].map(p=>'<li>'+p+'</li>').join('')+'</ol>'; return; }
  const totalBefore=rows.reduce((s,x)=>s+(x.before||0),0); const per=R.ventures.map((v,i)=>rows.reduce((s,x)=>s+((x.alloc||[])[i]||0),0)); const cash=rows.reduce((s,x)=>s+(x.cash||0),0);
  const ev=R.event.id; const bars=R.ventures.map((v,i)=>{ const m=v.mult[ev]!==undefined?v.mult[ev]:v.mult.base; const p=pct(per[i],totalBefore); const cls=v.flag?'bad':m>=1.3?'gold':''; return '<div class="b"><span>'+esc(v.name)+(v.flag?' <span class="pill bad">⚑</span>':'')+(v.planet>0?' <span class="pill good">+</span>':'')+'</span><div class="track"><div class="fill '+cls+'" style="width:'+p+'%"></div></div><span>'+p+'% · ×'+m.toFixed(2)+'</span></div>'; }).join('')+'<div class="b"><span>'+t('cashRow')+'</span><div class="track"><div class="fill" style="width:'+pct(cash,totalBefore)+'%;background:var(--muted)"></div></div><span>'+pct(cash,totalBefore)+'% · ×1.00</span></div>';
  const trapN=rows.filter(x=>(x.pts||[]).some(p=>p[0]==='trap')).length; const avgRet=rows.reduce((s,x)=>s+((x.after/x.before)-1),0)/rows.length*100; const avgP=rows.reduce((s,x)=>s+(x.p||0),0)/rows.length;
  el.innerHTML='<p class="eyebrow" style="color:var(--gold)">'+tx(R,Z,'theme')+'</p><h3 style="margin-top:2px">'+tx(R.event,Z.event,'title')+'</h3><div class="tag" style="margin-top:4px">'+t('classIn')+' · '+fmt(totalBefore)+'</div><div class="bars">'+bars+'</div>'+
   '<div class="kv"><div><b>'+trapN+' / '+rows.length+'</b><small>'+t('trapTeams')+'</small></div><div><b class="'+(avgRet>=0?'up':'down')+'">'+(avgRet>=0?'+':'')+avgRet.toFixed(1)+'%</b><small>'+t('avgRet')+'</small></div><div><b>'+avgP.toFixed(1)+'</b><small>'+t('avgPts')+'</small></div></div>'+
   '<p class="muted" style="margin-top:10px">'+esc(tx(R.event,Z.event,'lesson'))+'</p><ol class="signals prompts">'+t('prompts')[ri].map(p=>'<li>'+p+'</li>').join('')+'</ol>'; }
function paintPatterns(teams){ const done=teams.filter(r=>(r.rounds||[]).length>0); if(!done.length){ $('dbPatterns').innerHTML=''; return; }
  const rets=r=>(r.rounds||[]).map(x=>x.after/x.before-1); const spread=r=>{ const a=rets(r); if(a.length<2) return 99; return Math.max(...a)-Math.min(...a); };
  const consistent=done.slice().sort((a,b)=>spread(a)-spread(b))[0]; let swing=null,swingV=0; done.forEach(r=>rets(r).forEach((v,i)=>{ if(v<swingV){ swingV=v; swing={r,i}; } }));
  const trapHit=done.filter(r=>(r.rounds||[]).some(x=>(x.pts||[]).some(p=>p[0]==='trap'))).length; const reserve=done.filter(r=>(r.rounds||[]).filter(x=>(x.pts||[]).some(p=>p[0]==='resv')).length>=3).length;
  let imp=0,tot=0; done.forEach(r=>(r.rounds||[]).forEach(x=>{ tot+=x.before||0; (x.alloc||[]).forEach((a,i)=>{ if(ROUNDS[x.ri].ventures[i].planet>0) imp+=a; }); }));
  const P=t('pat'); const vals=[consistent?esc(consistent.team):'·', swing?esc(swing.r.team)+' · '+(swingV*100).toFixed(0)+'% ('+(swing.i+1)+')':'·', trapHit+' / '+done.length, reserve+' / '+done.length, pct(imp,tot)+'%'];
  $('dbPatterns').innerHTML=P.title.map((tt,i)=>'<div class="tcard"><span class="tag">'+tt+'</span><b style="font-size:20px;font-family:var(--display)">'+vals[i]+'</b><p>'+P.desc[i]+'</p></div>').join(''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- render everything in the current language ----------
function render(){ applyStatic(); rail(); paintBoard(); paintKey(); $('bMsg').textContent=''; $('syncHint').textContent=cbReady?t('syncOn'):t('syncOff'); paintSyncState(); if(!$('view-debrief').hidden) paintDebrief();
  if(view==='round') showRound(true); else if(view==='result') showResult(); else if(view==='final') showFinal(); else show('setup'); }

// ---------- boot ----------
function start(){ restore(); paint(); cbInit();
  if(S.team&&S.round>0&&S.round<5){ view='round'; }
  else if(S.team&&S.round>=5){ view='final'; } else view='setup';
  render(); }
window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>S);
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(start):start();
})();
</script>
